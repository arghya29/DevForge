# ═══════════════════════════════════════════════════════════
#  DevForge — CI Checks
#  Runs on PRs to dev and pushes to dev + main.
#  All checks must pass before a PR can be merged.
# ═══════════════════════════════════════════════════════════

name: CI Checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Code Quality (Lint, Format & HTML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JS Lint
        run: npm run lint:js

      - name: Run Prettier Check
        if: always()
        run: npm run format:check

      - name: Run HTML Validate
        if: always()
        run: npm run lint:html

      - name: Run Tests
        if: always()
        run: npm test
